    - 'Je conçois, déploie et exploite des <strong>plateformes Azure qui font tourner des charges d''IA</strong> : environnements Databricks, pipelines de données et systèmes critiques. <strong>Plus de 25 ans</strong> en salle des machines m''ont appris une chose : ce qui se fait deux fois à la main mérite d''être automatisé.'
