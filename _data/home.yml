    - 'Je termine un <strong>certificat universitaire en science des données</strong> et je participe à des compétitions <a href="https://www.kaggle.com/dominicdapice" target="_blank" rel="noopener">Kaggle</a> pour confronter la théorie à des problèmes réels.'
