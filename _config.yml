title: Dominic D'Apice
tagline: Developer - Azure Infrastructure AI
description: >-
  Developer - Azure Infrastructure AI in Montréal, Canada. 25+ years automating
  complex systems: Azure, Databricks, Ansible, Terraform, MLOps & DataOps.
url: "https://dominicdapice.com"

# Default meta keywords (used by Bing; pages can override with their own
# `keywords:` list - `topics:` and `tags:` are used as fallbacks per page)
keywords:
  - Dominic D'Apice
  - dapiced
  - Azure Infrastructure AI
  - Databricks
  - MLOps
  - DataOps
  - Ansible
  - Terraform
  - Infrastructure as Code
  - DevOps
  - Data Science
  - Machine Learning
  - Montréal
author:
  name: Dominic D'Apice
lang: en
timezone: America/Toronto

# Default social share image (og:image / twitter:image) for pages without their own
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-default.jpg
  - scope:
      path: ""
      type: apod
    values:
      layout: apod
social:
  name: Dominic D'Apice
  links:
    - https://github.com/dapiced
    - https://www.linkedin.com/in/dapiced/
    - https://www.kaggle.com/dominicdapice
    - https://huggingface.co/dapiced

permalink: /blog/:year/:month/:title/

collections:
  portfolio:
    output: true
    permalink: /portfolio/:name/
  # Automated NASA APOD entries ("Sky"), kept apart from the author's blog posts.
  apod:
    output: true
    permalink: /sky/:year/:month/:day/:title/

markdown: kramdown
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

feed:
  path: feed.xml
  collections:
    apod:
      path: "/feed/apod.xml"

exclude:
  - README.md
  - LICENSE
  - tools/
