name: Deploy to GitHub Pages

# Builds the site with the Gemfile (Jekyll 4.x) instead of the legacy GitHub
# Pages builder, which is pinned to Jekyll 3.x and ignores the Gemfile.
#
# Pull requests are covered by ci.yml, which builds the same site without the
# pages/id-token write permissions needed here. The deploy job is gated on
# main: a manual run on another branch builds and uploads the artifact but
# does not deploy. A dispatch on main deploys; cosmic-daily.yml relies on it,
# because its auto-merge uses the GITHUB_TOKEN, whose pushes fire no workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  # Let a queued deploy wait its turn rather than dropping a publish.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
