name: Cosmic Daily

on:
  workflow_dispatch:
    inputs:
      date:
        description: APOD date to process (YYYY-MM-DD). Leave blank for today.
        required: false
        default: ""
      publish:
        description: Create a PR for the generated post instead of previewing only.
        required: true
        default: false
        type: boolean
  schedule:
    # 12:00 UTC (08:00 EDT / 07:00 EST) — APOD for the current US day is
    # already published by then. Runs generate the article, validate it
    # (rights, duplicates, front matter, image), open a PR, then squash-merge
    # it automatically once validation has passed.
    - cron: "0 12 * * *"

# No ambient permissions: each job asks for exactly what it needs.
permissions: {}

jobs:
  cosmic-daily:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      # Dispatch and watch ci.yml on the generated PR, then dispatch pages.yml
      # after an auto-merge: the GITHUB_TOKEN's PRs and pushes fire no workflow.
      actions: write

    outputs:
      target-date: ${{ steps.target.outputs.value }}
      pull-request: ${{ steps.create-pr.outputs.pull-request-number }}
      log-tail: ${{ steps.log.outputs.tail }}
      result: ${{ steps.apod.outputs.result }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Cosmic Daily
        working-directory: tools/cosmic-daily
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Resolve target date
        id: target
        shell: bash
        run: |
          target="${{ inputs.date }}"
          if [ -z "$target" ]; then
            target="$(date -u +%F)"
          fi
          echo "value=$target" >> "$GITHUB_OUTPUT"

      - name: Resolve publish flag
        id: mode
        shell: bash
        run: |
          # Manual runs use the publish input; scheduled runs always publish
          # (i.e. generate, open a PR, and auto-merge it once validated).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Preview or generate APOD content
        id: apod
        if: always()
        working-directory: tools/cosmic-daily
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY_OFFICIAL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.publish }}" = "true" ]; then
            python -m cosmic_daily generate --date "${{ steps.target.outputs.value }}" | tee /tmp/cosmic-daily.log
          else
            python -m cosmic_daily preview --date "${{ steps.target.outputs.value }}" | tee /tmp/cosmic-daily.log
          fi

          if grep -q "Generated post:" /tmp/cosmic-daily.log; then
            post_path="$(grep 'Generated post:' /tmp/cosmic-daily.log | sed 's#.*Generated post: ##')"
            echo "post_path=$post_path" >> "$GITHUB_OUTPUT"
          fi
          if grep -q "manual review" /tmp/cosmic-daily.log; then
            echo "result=manual_review" >> "$GITHUB_OUTPUT"
          else
            echo "result=generated" >> "$GITHUB_OUTPUT"
          fi

          # Video days (and duplicates) exit 0 without a post: record why in
          # the run summary so the gap is explained without a notification.
          if grep -qE "^(Skipped:|Duplicate APOD)" /tmp/cosmic-daily.log; then
            {
              echo "### Cosmic Daily ${{ steps.target.outputs.value }}"
              echo
              echo "No post published: $(grep -E '^(Skipped:|Duplicate APOD)' /tmp/cosmic-daily.log | head -n 1)"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate generated post
        if: ${{ steps.mode.outputs.publish == 'true' && steps.apod.outputs.post_path != '' }}
        working-directory: tools/cosmic-daily
        shell: bash
        run: |
          set -euo pipefail
          python -m cosmic_daily check --post-path "${{ steps.apod.outputs.post_path }}"

      - name: Create pull request
        if: ${{ steps.mode.outputs.publish == 'true' && steps.apod.outputs.post_path != '' }}
        id: create-pr
        uses: peter-evans/create-pull-request@v8
        with:
          branch: "cosmic-daily/${{ steps.target.outputs.value }}"
          title: "Cosmic Daily: ${{ steps.target.outputs.value }}"
          body: |
            Automated APOD entry for ${{ steps.target.outputs.value }} (published under /sky/).

            - Generated from NASA APOD data
            - Validated with the local checker (rights, duplicates, front matter, image)

            This PR is auto-merged only when the rights policy marks the image as
            safe. Third-party copyright metadata remains open for manual review.
          commit-message: "Add Cosmic Daily APOD entry for ${{ steps.target.outputs.value }}"
          delete-branch: true

      - name: Run CI on the pull request
        # A PR opened with the GITHUB_TOKEN does not trigger ci.yml, so dispatch
        # it on the PR branch and wait for the result. Its checks show on the
        # PR, and a red CI stops the job before any merge (and opens the
        # failure issue).
        if: ${{ steps.create-pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          BRANCH: cosmic-daily/${{ steps.target.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          gh workflow run ci.yml --ref "$BRANCH"
          run_id=""
          for _ in $(seq 1 30); do
            run_id="$(gh run list --workflow ci.yml --branch "$BRANCH" --event workflow_dispatch \
              --json databaseId,headSha \
              --jq "map(select(.headSha == \"$head_sha\")) | .[0].databaseId // empty")"
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -z "$run_id" ]; then
            echo "CI run for $head_sha did not start on $BRANCH"
            exit 1
          fi
          gh run watch "$run_id" --exit-status --interval 15

      - name: Remove the placeholder pull_request CI run
        # Opening the PR with the GITHUB_TOKEN still makes GitHub create a
        # ci.yml "pull_request" run, but it never starts a job: it sits
        # pending and turns into a red "failure" once the branch is merged
        # and deleted. The real CI is the dispatched run above, so cancel and
        # delete that empty run (matched on the bot's head commit, so a run
        # from a later human push is left alone). Cosmetic: never blocks.
        if: ${{ always() && steps.create-pr.outputs.pull-request-number != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
          BRANCH: cosmic-daily/${{ steps.target.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(gh pr view "$PR_NUMBER" --json headRefOid --jq .headRefOid)"
          ids="$(gh run list --workflow ci.yml --branch "$BRANCH" --event pull_request \
            --json databaseId,headSha \
            --jq "map(select(.headSha == \"$head_sha\")) | .[].databaseId")"
          for id in $ids; do
            gh run cancel "$id" || true
            for _ in $(seq 1 12); do
              [ "$(gh run view "$id" --json status --jq .status)" = "completed" ] && break
              sleep 5
            done
            gh run delete "$id"
            echo "Deleted placeholder CI run $id"
          done

      - name: Request Copilot review
        # Best-effort audit trail only: Copilot code review just leaves
        # comments, it never gates the merge below.
        if: ${{ steps.create-pr.outputs.pull-request-number != '' && steps.apod.outputs.result == 'generated' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ steps.create-pr.outputs.pull-request-number }}" --add-reviewer Copilot

      - name: Auto-merge validated post
        # Gates, in order: the "Validate generated post" step (rights policy,
        # duplicate detection, front matter/tags, image presence) and the CI
        # run above must both pass before this step is reached (the job stops
        # at the first failed step). Once they do, merge without waiting on a
        # human, then dispatch the Pages deployment: a merge made with the
        # GITHUB_TOKEN does not fire pages.yml on its own. Under the main
        # ruleset this merge is refused (docs/infra/github-ruleset.md): the
        # job then fails and the PR waits for a manual admin merge.
        if: ${{ steps.create-pr.outputs.pull-request-number != '' && steps.apod.outputs.result == 'generated' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.create-pr.outputs.pull-request-number }}" --squash --delete-branch
          gh workflow run pages.yml --ref main

      - name: Capture log tail for the failure report
        # Job outputs are single-line, so the tail crosses the job boundary
        # base64-encoded. Runs even when a previous step failed.
        id: log
        if: always()
        shell: bash
        run: |
          tail -n 60 /tmp/cosmic-daily.log 2>/dev/null > /tmp/cosmic-daily.tail || true
          if [ ! -s /tmp/cosmic-daily.tail ]; then
            echo 'Aucun log cosmic-daily disponible.' > /tmp/cosmic-daily.tail
          fi
          echo "tail=$(base64 -w0 /tmp/cosmic-daily.tail)" >> "$GITHUB_OUTPUT"

  report-failure:
    # Separate job so the only write grant for issue reporting is issues:write,
    # with no access to repository contents or pull requests.
    runs-on: ubuntu-latest
    needs: cosmic-daily
    if: failure()

    permissions:
      issues: write

    steps:
      - name: Report failure by email (via GitHub issue notification)
        # Opens an issue with error details whenever the generation job
        # failed (fetch error, rejected rights, validation failure, failed
        # auto-merge, etc.). GitHub emails watchers of this repo when a new
        # issue is created — check github.com/settings/notifications to
        # confirm email delivery is enabled for "Issues".
        # A video APOD is not a failure: the CLI exits 0 and the run summary
        # explains the skip. If an open issue already exists for the same
        # date (re-run of a failed job), the details are added as a comment
        # instead of opening a duplicate.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          LOG_TAIL_B64: ${{ needs.cosmic-daily.outputs.log-tail }}
        shell: bash
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          log_tail="$(printf '%s' "$LOG_TAIL_B64" | base64 -d 2>/dev/null || echo 'Aucun log cosmic-daily disponible.')"
          pr_number="${{ needs.cosmic-daily.outputs.pull-request }}"
          if [ -n "$pr_number" ]; then pr_ref="#$pr_number"; else pr_ref="aucune"; fi
          target="${{ needs.cosmic-daily.outputs.target-date }}"
          body="$(printf '%s\n\n- Date ciblee : `%s`\n- Declencheur : `%s`\n- Execution : %s\n- PR creee : %s\n\nDernieres lignes du log :\n```\n%s\n```\n' \
            "Le workflow Cosmic Daily a echoue et n'a pas ete publie." \
            "$target" \
            "${{ github.event_name }}" \
            "$run_url" \
            "$pr_ref" \
            "$log_tail")"
          title="Cosmic Daily: echec le $target"
          existing="$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty' || true)"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" \
              || echo "Failed to comment on issue #$existing; see run logs: $run_url"
          else
            gh issue create \
              --title "$title (run ${{ github.run_id }})" \
              --body "$body" || echo "Failed to open failure issue; see run logs: $run_url"
          fi
