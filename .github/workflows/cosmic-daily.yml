name: Cosmic Daily

on:
  workflow_dispatch:
    inputs:
      date:
        description: APOD date to process (YYYY-MM-DD). Leave blank for today.
        required: false
        default: ""
      publish:
        description: Create a PR for the generated post instead of previewing only.
        required: true
        default: false
        type: boolean
  schedule:
    # 12:00 UTC (08:00 EDT / 07:00 EST) — APOD for the current US day is
    # already published by then. Runs generate the article, validate it
    # (rights, duplicates, front matter, image), open a PR, then squash-merge
    # it automatically once validation has passed.
    - cron: "0 12 * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  cosmic-daily:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Cosmic Daily
        working-directory: tools/cosmic-daily
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Resolve target date
        id: target
        shell: bash
        run: |
          target="${{ inputs.date }}"
          if [ -z "$target" ]; then
            target="$(date -u +%F)"
          fi
          echo "value=$target" >> "$GITHUB_OUTPUT"

      - name: Resolve publish flag
        id: mode
        shell: bash
        run: |
          # Manual runs use the publish input; scheduled runs always publish
          # (i.e. generate + open a PR for review, never auto-merge).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=${{ inputs.publish }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Preview or generate APOD content
        id: apod
        if: always()
        working-directory: tools/cosmic-daily
        env:
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.mode.outputs.publish }}" = "true" ]; then
            python -m cosmic_daily generate --date "${{ steps.target.outputs.value }}" | tee /tmp/cosmic-daily.log
          else
            python -m cosmic_daily preview --date "${{ steps.target.outputs.value }}" | tee /tmp/cosmic-daily.log
          fi

          if grep -q "Generated post:" /tmp/cosmic-daily.log; then
            post_path="$(grep 'Generated post:' /tmp/cosmic-daily.log | sed 's#.*Generated post: ##')"
            echo "post_path=$post_path" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate generated post
        if: ${{ steps.mode.outputs.publish == 'true' && steps.apod.outputs.post_path != '' }}
        working-directory: tools/cosmic-daily
        shell: bash
        run: |
          set -euo pipefail
          python -m cosmic_daily check --post-path "${{ steps.apod.outputs.post_path }}"

      - name: Create pull request
        if: ${{ steps.mode.outputs.publish == 'true' && steps.apod.outputs.post_path != '' }}
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          branch: "cosmic-daily/${{ steps.target.outputs.value }}"
          title: "Cosmic Daily: ${{ steps.target.outputs.value }}"
          body: |
            Automated APOD article for ${{ steps.target.outputs.value }}.

            - Generated from NASA APOD data
            - Validated with the local checker (rights, duplicates, front matter, image)
            - This PR is auto-merged once validation passes; no manual approval step
          commit-message: "Add Cosmic Daily APOD post for ${{ steps.target.outputs.value }}"
          delete-branch: true

      - name: Request Copilot review
        # Best-effort audit trail only: Copilot code review just leaves
        # comments, it never gates the merge below.
        if: ${{ steps.create-pr.outputs.pull-request-number != '' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr edit "${{ steps.create-pr.outputs.pull-request-number }}" --add-reviewer Copilot

      - name: Auto-merge validated post
        # The real safety gate is the "Validate generated post" step above:
        # rights policy, duplicate detection, front matter/tags, and image
        # presence must all pass before this step is even reached (the job
        # stops at the first failed step). Once that passes, merge without
        # waiting on a human.
        if: ${{ steps.create-pr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge "${{ steps.create-pr.outputs.pull-request-number }}" --squash --delete-branch

      - name: Report failure by email (via GitHub issue notification)
        # Opens an issue with error details whenever any prior step in this
        # job failed (fetch error, rejected rights, validation failure,
        # failed auto-merge, etc.). GitHub emails watchers of this repo when
        # a new issue is created — check github.com/settings/notifications
        # to confirm email delivery is enabled for "Issues".
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          log_tail="$(tail -n 60 /tmp/cosmic-daily.log 2>/dev/null || echo 'Aucun log cosmic-daily disponible.')"
          pr_ref="${{ steps.create-pr.outputs.pull-request-number && format('#{0}', steps.create-pr.outputs.pull-request-number) || 'aucune' }}"
          body="$(printf '%s\n\n- Date ciblee : `%s`\n- Declencheur : `%s`\n- Execution : %s\n- PR creee : %s\n\nDernieres lignes du log :\n```\n%s\n```\n' \
            "Le workflow Cosmic Daily a echoue et n'a pas ete publie." \
            "${{ steps.target.outputs.value }}" \
            "${{ github.event_name }}" \
            "$run_url" \
            "$pr_ref" \
            "$log_tail")"
          gh issue create \
            --title "Cosmic Daily: echec le ${{ steps.target.outputs.value }} (run ${{ github.run_id }})" \
            --body "$body" || echo "Failed to open failure issue; see run logs: $run_url"
