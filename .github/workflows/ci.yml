name: CI

# Runs on every pull request and on main. The site job proves the Jekyll build
# still works and that the pages the rest of the site links to are generated;
# the cosmic-daily job runs the Python test suite behind the APOD generator.
#
# workflow_dispatch lets cosmic-daily.yml run this CI on its own pull requests:
# PRs opened with the default GITHUB_TOKEN never fire pull_request, but a
# dispatch from that token does start a run, attached to the branch head.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  site:
    name: Jekyll build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python for site data checks
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate site source and data
        run: |
          python -m pip install "PyYAML==6.0.3" "pytest>=8.0.0" "Pillow>=10"
          python -m pytest \
            tests/test_now_page.py \
            tests/test_now_freshness.py \
            tests/test_now_workflow.py \
            tests/test_resume_page.py \
            tests/test_no_employer_mention.py \
            tests/test_sky_thumbnails.py \
            tests/test_design_system.py \
            tests/test_og_cards.py \
            tests/test_about_page.py \
            tests/test_french_section.py \
            tests/test_pwa.py \
            tests/test_sky_map.py \
            tests/test_production_check.py \
            tests/test_ruleset.py \
            tests/test_posts.py \
            tests/test_site_data.py \
            tests/test_final_hardening_contracts.py -q
          python tools/site-checks/validate_site_data.py
          set +e
          python tools/site-checks/check_now_freshness.py
          freshness_status=$?
          set -e
          if [ "$freshness_status" -ne 0 ] && [ "$freshness_status" -ne 2 ]; then
            exit "$freshness_status"
          fi

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Set up Node.js for search tests and browser checks
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm
          cache-dependency-path: tools/site-checks/browser/package-lock.json

      - name: Test local blog search
        run: node --test tools/site-checks/js/*.test.js

      - name: Check generated output
        run: |
          set -euo pipefail
          python tools/site-checks/check_site_data_html.py
          python tools/site-checks/check_now_generated.py
          python tools/site-checks/check_i18n_generated.py
          for path in \
            _site/index.html \
            _site/now/index.html \
            _site/resume/index.html \
            _site/sky/index.html \
            _site/feed.xml \
            _site/feed/apod.xml \
            _site/sitemap.xml \
            _site/404.html \
            _site/blog/tag/machine-learning/index.html \
            _site/blog/search/index.html \
            _site/blog/search.json; do
            test -s "$path" || { echo "Missing or empty: $path"; exit 1; }
          done
          # jekyll-redirect-from emits a meta refresh page at every old URL.
          if grep -rl "redirect_from" _posts _apod _portfolio >/dev/null 2>&1; then
            grep -rl "http-equiv=\"refresh\"" _site >/dev/null \
              || { echo "redirect_from declared but no redirect page emitted"; exit 1; }
          fi
          python tools/site-checks/check_blog_discovery.py
          # Share cards (tools/og-cards) reach og:image through _plugins/og_cards.rb.
          grep -q 'property="og:image" content="https://dominicdapice.com/assets/img/og/hello-universe.jpg"' \
            _site/blog/2026/07/hello-universe/index.html \
            || { echo "og:image does not use the generated share card"; exit 1; }

      # Internal links only (offline): every href/src inside _site must resolve.
      # External links are checked weekly by links-weekly.yml, so a third-party
      # outage never blocks a pull request.
      - name: Check internal links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --root-dir ${{ github.workspace }}/_site '_site/**/*.html'
          fail: true

      - name: Install browser checks
        working-directory: tools/site-checks/browser
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # WCAG 2.2 A/AA with axe-core on every sitemap page plus the 404 page,
      # desktop and mobile. Serious and critical violations fail the build.
      - name: Accessibility (axe)
        working-directory: tools/site-checks/browser
        run: node axe-check.mjs

      # Command palette end to end: shortcuts, search, keyboard, axe on the dialog.
      - name: Command palette
        working-directory: tools/site-checks/browser
        run: node palette-check.mjs

      # Offline support end to end: worker control, cached pages, "Signal lost".
      - name: Offline support
        working-directory: tools/site-checks/browser
        run: node pwa-check.mjs

      # Median of 3 runs on representative pages; thresholds in lighthouserc.json.
      - name: Lighthouse
        working-directory: tools/site-checks/browser
        run: npx lhci autorun --config=lighthouserc.json

      - name: Keep Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Scans the whole git history for committed tokens and keys with the
      # MIT-licensed gitleaks binary (pinned version, checksum verified).
      # Reviewed false positives live in .gitleaksignore.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --exit-code 1 .

  cosmic-daily:
    name: Cosmic Daily tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/cosmic-daily/pyproject.toml

      - name: Install Cosmic Daily
        working-directory: tools/cosmic-daily
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[dev]

      - name: Run tests
        working-directory: tools/cosmic-daily
        run: python -m pytest
