name: IndexNow - notify search engines

# Submits every URL from the live sitemap to the IndexNow API (used by Bing
# and other engines). Google does not support IndexNow: it re-crawls the
# sitemap registered in Search Console on its own.
#
# Chained to the Pages deployment rather than to the push itself, so the
# sitemap read below is the one that was just published. The head_branch
# guard keeps manual Pages runs on other branches from notifying.

on:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
  workflow_dispatch:

permissions: {}

jobs:
  indexnow:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' ||
        github.event.workflow_run.event == 'deployment'))
    runs-on: ubuntu-latest
    steps:
      - name: Submit sitemap URLs to IndexNow
        run: |
          set -euo pipefail
          urls=$(curl -fsSL https://dominicdapice.com/sitemap.xml \
            | grep -o '<loc>[^<]*</loc>' | sed 's/<[^>]*>//g')
          echo "Submitting $(echo "$urls" | wc -l) URLs:"
          echo "$urls"
          payload=$(echo "$urls" | jq -R . | jq -s '{
            host: "dominicdapice.com",
            key: "3678563103b4f11c9ed1cb8d806c655d",
            keyLocation: "https://dominicdapice.com/3678563103b4f11c9ed1cb8d806c655d.txt",
            urlList: .
          }')
          code=$(curl -sS -o /tmp/indexnow-response.txt -w '%{http_code}' \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$payload")
          echo "IndexNow response: HTTP $code"
          cat /tmp/indexnow-response.txt || true
          # 200 = submitted, 202 = accepted (key validation pending)
          [ "$code" = "200" ] || [ "$code" = "202" ]
