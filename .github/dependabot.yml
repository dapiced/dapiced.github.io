version: 2

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    groups:
      jekyll:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: "/tools/cosmic-daily"
    schedule:
      interval: weekly
    groups:
      cosmic-daily:
        patterns: ["*"]
