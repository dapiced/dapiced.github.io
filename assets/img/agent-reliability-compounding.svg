  <line x1="100" y1="400" x2="1130" y2="400" stroke="#1A2338"/>
  <text x="90" y="404" font-size="11" text-anchor="end" class="dim">25%</text>
  <line x1="100" y1="330" x2="1130" y2="330" stroke="#1A2338"/>
  <text x="90" y="334" font-size="11" text-anchor="end" class="dim">50%</text>
  <line x1="100" y1="260" x2="1130" y2="260" stroke="#1A2338"/>
  <text x="90" y="264" font-size="11" text-anchor="end" class="dim">75%</text>
  <line x1="100" y1="190" x2="1130" y2="190" stroke="#1A2338"/>
  <text x="90" y="194" font-size="11" text-anchor="end" class="dim">100%</text>
  <line x1="100" y1="470" x2="100" y2="476" stroke="#263450"/>
  <text x="100" y="494" font-size="11" text-anchor="middle" class="dim">0</text>
  <line x1="306" y1="470" x2="306" y2="476" stroke="#263450"/>
  <text x="306" y="494" font-size="11" text-anchor="middle" class="dim">10</text>
  <line x1="512" y1="470" x2="512" y2="476" stroke="#263450"/>
  <text x="512" y="494" font-size="11" text-anchor="middle" class="dim">20</text>
  <line x1="718" y1="470" x2="718" y2="476" stroke="#263450"/>
  <text x="718" y="494" font-size="11" text-anchor="middle" class="dim">30</text>
