  <text x="1176" y="540" font-size="10" text-anchor="end" class="dim">Arithmetic, not pessimism: 0.99&#8309;&#8304; &#8776; 0.61 &#183; 0.95&#8309;&#8304; &#8776; 0.08</text>
</svg>
