<svg viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Line chart of the probability that a multi-step agent workflow completes, when every step must succeed. With 99 percent reliability per step the success rate falls to about 61 percent by step 50; with 95 percent per step it falls to about 8 percent. Pure arithmetic: p to the power n.">
  <style>
    text { font-family: "JetBrains Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace; }
    .t   { fill:#E6EDF7; }
    .s   { fill:#8CA0BE; }
    .dim { fill:#54637F; }
  </style>
  
  <rect x="0" y="0" width="1200" height="560" fill="#070B14"/>
  <rect x="8" y="8" width="1184" height="544" rx="12" fill="#0A0F1C" stroke="#263450"/>
  <rect x="8" y="8" width="1184" height="34" rx="12" fill="#0D1526"/>
  <rect x="8" y="30" width="1184" height="12" fill="#0D1526"/>
  <line x1="8" y1="42" x2="1192" y2="42" stroke="#263450"/>
  <circle cx="32" cy="25" r="5" fill="#E0655F" opacity="0.9"/>
  <circle cx="52" cy="25" r="5" fill="#E3B341" opacity="0.9"/>
  <circle cx="72" cy="25" r="5" fill="#57AB5A" opacity="0.9"/>
  <text x="94" y="29" font-size="12"><tspan class="s" font-weight="bold">dominic@azure</tspan><tspan class="dim">:~$</tspan><tspan class="t"> plot p^n --steps 50</tspan></text>
  <text x="1176" y="29" font-size="10" text-anchor="end" class="dim">RELIABILITY MATH</text>
  <text x="40" y="88" font-size="21" font-weight="bold" class="t">Why long agent workflows fail: reliability compounds</text>
  <text x="40" y="114" font-size="13" class="s">Probability the whole workflow succeeds when every step must &#8212; p&#8319; for n steps</text>
  <rect x="810" y="132" width="14" height="4" rx="2" fill="#1887BD"/>
  <text x="832" y="139" font-size="12" class="s">99% reliable per step</text>
  <rect x="1010" y="132" width="14" height="4" rx="2" fill="#C4811C"/>
  <text x="1032" y="139" font-size="12" class="s">95% per step</text>
  <line x1="100" y1="470" x2="1130" y2="470" stroke="#1A2338"/>
