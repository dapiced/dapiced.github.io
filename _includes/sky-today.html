{%- if site.apod.size > 0 -%}
{%- assign sky_latest = site.apod | sort: "date" | last -%}
<div class="sky-today reveal">
  {% if sky_latest.image %}
  <a class="sky-today-media" href="{{ sky_latest.url }}" tabindex="-1" aria-hidden="true"><img src="{{ sky_latest.image }}" alt=""{% if sky_latest.image_width %} width="{{ sky_latest.image_width }}"{% endif %}{% if sky_latest.image_height %} height="{{ sky_latest.image_height }}"{% endif %} loading="lazy" decoding="async"></a>
  {% endif %}
  <span class="sky-today-body">
    <span class="sky-today-label">Sky of the day · NASA APOD</span>
    <a class="sky-today-title" href="{{ sky_latest.url }}">{{ sky_latest.title }}</a>
    <time datetime="{{ sky_latest.date | date_to_xmlschema }}">{{ sky_latest.date | date: "%B %-d, %Y" }}</time>
    <a class="beyond-more" href="/sky/">Browse the sky archive →</a>
  </span>
</div>
{%- endif -%}
